version: '3.9'

services:
  website:
    container_name: tcg_website
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8081"
    depends_on:
      - db
    networks:
      - tcg_network
    environment:
      - DOTNET_RUNNING_IN_CONTAINER=true
      - ENV NUGET_PACKAGES=/root/.nuget/packages
    command: >
      dotnet watch run
      --project TCG.Website/TCG.Website.csproj
      --no-launch-profile
      --urls http://0.0.0.0:8081
      --launch-profile "Development"
    volumes:
      - ./TCG.Website:/app/TCG.Website:cached
      - ./TCG.Domain:/app/TCG.Domain:cached
      - ./TCG.Application:/app/TCG.Application:cached
      - ./TCG.Infrastructure:/app/TCG.Infrastructure:cached

  ems:
    container_name: tcg_ems
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    depends_on:
      - db
    networks:
      - tcg_network
    environment:
      - DOTNET_RUNNING_IN_CONTAINER=true
      - ENV NUGET_PACKAGES=/root/.nuget/packages
    command: >
      dotnet watch run
      --project TCG.EMS/TCG.EMS.csproj
      --no-launch-profile
      --urls http://0.0.0.0:8080
      --launch-profile "Development"
    volumes:
      - ./TCG.EMS:/app/TCG.EMS:cached
      - ./TCG.Domain:/app/TCG.Domain:cached
      - ./TCG.Application:/app/TCG.Application:cached
      - ./TCG.Infrastructure:/app/TCG.Infrastructure:cached

  db:
    container_name: tcg_db
    image: postgres:18.1
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: tcg_db
    networks:
      - tcg_network

  pgadmin:
    container_name: tcg_pgadmin
    image: dpage/pgadmin4:9.11
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: 98bennicholls@pm.me
      PGADMIN_DEFAULT_PASSWORD: secret
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    restart: always
    networks:
      - tcg_network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  tcg_network:
    driver: bridge