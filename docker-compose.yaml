version: '3.9'

services:
  website:
    container_name: tcg_website
    build:
      context: .
      dockerfile: TCG.Website/Dockerfile
    ports:
      - "5000:8080"   # Match EXPOSE in Dockerfile
    depends_on:
      - db
    networks:
      - tcg_network
    environment:
      - DOTNET_RUNNING_IN_CONTAINER=true
      - DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER=true
      - MSBUILDDISABLENODEREUSE=1
      - DOTNET_USE_POLLING_FILE_WATCHER=1
    volumes:
      - dp_keys_website:/root/.aspnet/DataProtection-Keys
      - ./TCG.Website:/src/TCG.Website
      - ./TCG.Application:/src/TCG.Application
      - ./TCG.Domain:/src/TCG.Domain
      - ./TCG.Infrastructure:/src/TCG.Infrastructure

  ems:
    container_name: tcg_ems
    build:
      context: .
      dockerfile: TCG.EMS/Dockerfile
    ports:
      - "5001:8080"
    depends_on:
      - db
    networks:
      - tcg_network
    environment:
      - DOTNET_RUNNING_IN_CONTAINER=true
      - DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER=true
      - MSBUILDDISABLENODEREUSE=1
      - DOTNET_USE_POLLING_FILE_WATCHER=1
    volumes:
      - dp_keys_ems:/root/.aspnet/DataProtection-Keys
      - ./TCG.EMS:/src/TCG.EMS
      - ./TCG.Application:/src/TCG.Application
      - ./TCG.Domain:/src/TCG.Domain
      - ./TCG.Infrastructure:/src/TCG.Infrastructure

  db:
    container_name: tcg_db
    image: postgres:18.1
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: tcg_db
    networks:
      - tcg_network

  pgadmin:
    container_name: tcg_pgadmin
    image: dpage/pgadmin4:9.11
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: 98bennicholls@pm.me
      PGADMIN_DEFAULT_PASSWORD: secret
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    restart: always
    networks:
      - tcg_network

volumes:
  postgres_data:
  pgadmin_data:
  dp_keys_website:
  dp_keys_ems:

networks:
  tcg_network:
    driver: bridge